name: Build Dua & Zikr APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Validate and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for duplicate Arabic content and run full validation
        run: python3 tools/validate.py

      - name: Run logic tests (repeat parsing, mixed flow, settings, contract)
        run: python3 tools/test_logic.py

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dua-and-zikr-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  smoke:
    name: DOM runtime smoke test (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install jsdom
        run: npm install jsdom@24 --no-audit --no-fund
      - name: Run DOM smoke test
        run: node tools/dom_smoke.mjs
